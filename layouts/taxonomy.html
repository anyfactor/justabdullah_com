{{ define "main" }}
<section class="container list-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="term-list">
    {{ range .Pages.ByTitle }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="term-count">{{ len .Pages }}</span>
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
